name: Lint Code

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Lint JavaScript
        run: npx eslint .

      - name: Lint CSS
        run: npx stylelint "**/*.css"

      - name: Lint HTML
        run: npx htmlhint "**/*.html"